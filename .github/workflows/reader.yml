name: Build and deploy reader
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'volumes/**'
      - 'docs/knowledge.json'
      - 'docs/notation.tex'
      - 'scripts/viewer-tex.mjs'
      - 'scripts/build-site.mjs'
      - 'scripts/figure-math.mjs'
      - 'scripts/test-figure-math.mjs'
      - 'scripts/test-viewer*.mjs'
      - 'scripts/statements-tex.mjs'
      - 'scripts/knowledge*.mjs'
      - '.github/workflows/reader.yml'
  workflow_dispatch:
    inputs:
      full_browser:
        description: '全ノートの個別URLも検査する（通常は部単位で検査）'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: genron-reader
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install viewer libraries
        run: npm install --no-save --ignore-scripts --package-lock=false --omit=optional katex@0.16.22 playwright-core@1.51.1 mathjax-full@3.2.2
      - name: Test and build
        run: |
          node scripts/test-viewer-tex.mjs
          node scripts/test-knowledge.mjs
          node scripts/test-statements-tex.mjs
          node scripts/test-figure-math.mjs
          node scripts/build-site.mjs
      - name: Browser smoke test
        env:
          GENRON_BROWSER_FULL: ${{ inputs.full_browser && '1' || '0' }}
        run: node scripts/test-viewer-browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: genron-reader
          path: _site
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

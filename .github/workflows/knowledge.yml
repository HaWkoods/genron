name: Knowledge consistency
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node scripts/test-knowledge.mjs
      - name: Validate ledger and manuscripts
        run: node scripts/knowledge.mjs check
      - name: Verify generated roadmap
        run: |
          node scripts/knowledge.mjs graph plan --markdown > /tmp/genron-roadmap.md
          diff -u docs/roadmap.md /tmp/genron-roadmap.md
      - name: Verify generated statements
        run: |
          node scripts/knowledge.mjs statements > /tmp/genron-statements.md
          diff -u docs/statements.md /tmp/genron-statements.md
      - name: Verify statement catalogue TeX
        run: |
          node scripts/test-statements-tex.mjs
          # The PDF catalogue is a historical snapshot; Web-only entries are in statements.md.
          test "$(head -c 5 docs/statements.pdf)" = '%PDF-'
      - name: Report affected knowledge
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE:docs/knowledge.json" 2>/dev/null; then
            node scripts/knowledge.mjs impact --base "$BASE"
          else
            echo "No previous ledger available; impact comparison skipped."
          fi
